name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build jar, exe and full package
        run: mvn -B -Drevision="${GITHUB_REF_NAME#v}" -Pfull package

      - name: Checksums
        working-directory: target
        run: |
          sha256sum AwakePlanner.jar > AwakePlanner.jar.sha256
          sha256sum AwakePlanner.exe > AwakePlanner.exe.sha256
          sha256sum AwakePlanner-full.zip > AwakePlanner-full.zip.sha256
          sha256sum AwakePlanner.runtime > AwakePlanner.runtime.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            target/AwakePlanner.jar target/AwakePlanner.jar.sha256 \
            target/AwakePlanner.exe target/AwakePlanner.exe.sha256 \
            target/AwakePlanner-full.zip target/AwakePlanner-full.zip.sha256 \
            target/AwakePlanner.runtime target/AwakePlanner.runtime.sha256 \
            --title "AwakePlanner $GITHUB_REF_NAME" \
            --generate-notes
